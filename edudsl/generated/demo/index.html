<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntroductionPython</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>IntroductionPython</h1><p>Comprendre les variables en Python — Niveau : Débutant</p></header><section class="activity"><h2>Diagnostic</h2><fieldset><legend>1. Que représente une variable ?</legend><label><input type="radio" name="Diagnostic-q0" value="0"> Une valeur nommée</label><br><label><input type="radio" name="Diagnostic-q0" value="1"> Une image uniquement</label><br><label><input type="radio" name="Diagnostic-q0" value="2"> Un câble réseau</label></fieldset><fieldset><legend>2. Quel mot-clé affiche une valeur en Python ?</legend><label><input type="radio" name="Diagnostic-q1" value="0"> print</label><br><label><input type="radio" name="Diagnostic-q1" value="1"> displaySQL</label><br><label><input type="radio" name="Diagnostic-q1" value="2"> showHTML</label></fieldset><button onclick="grade('Diagnostic')">Évaluer</button><p id="feedback-Diagnostic"></p></section></main><script>const answers={"Diagnostic": [0, 0]}; function grade(name){const expected=answers[name];let score=0;expected.forEach((a,i)=>{const x=document.querySelector('input[name="'+name+'-q'+i+'"]:checked');if(x&&Number(x.value)===a)score++;});const pct=Math.round(score*100/expected.length);document.getElementById('feedback-'+name).textContent='Score : '+pct+'% — '+(pct>=50?'Réussite':'Remédiation recommandée');}</script></body></html>
